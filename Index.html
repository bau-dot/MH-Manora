<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Lover</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            padding: 10px;
            overflow: hidden;
            position: relative;
        }

        /* Background Video - Full HD View */
        #bg-video {
            position: fixed;
            right: 0;
            bottom: 0;
            min-width: 100%;
            min-height: 100%;
            object-fit: cover;
            z-index: -1;
        }

        /* Light Overlay */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.2);
            z-index: 0;
        }

        /* Floating Love Emojis in Background */
        .floating-heart {
            position: absolute;
            bottom: -50px;
            font-size: 22px;
            animation: floatUp 5s linear infinite;
            z-index: 1;
            opacity: 0.8;
            pointer-events: none;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(0) scale(0.8);
                opacity: 0;
            }
            20% {
                opacity: 0.8;
            }
            100% {
                transform: translateY(-110vh) scale(1.3);
                opacity: 0;
            }
        }

        .container {
            width: 100%;
            max-width: 320px;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 2;
        }

        /* Profile Section */
        .profile-section {
            text-align: center;
            margin-bottom: 6px;
        }

        .avatar-link {
            display: inline-block;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .avatar-link:active {
            transform: scale(0.95);
        }

        .avatar-ring {
            width: 65px;
            height: 65px;
            border-radius: 50%;
            padding: 2px;
            background: linear-gradient(45deg, #ff007f, #00f2fe);
            margin: 0 auto 4px auto;
        }

        .avatar-ring img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
        }

        .profile-section h1 {
            font-size: 14px;
            letter-spacing: 1.5px;
            background: linear-gradient(45deg, #ff007f, #00f2fe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 2px;
        }

        .profile-section p {
            font-size: 8px;
            color: #eee;
            letter-spacing: 1px;
            margin-bottom: 3px;
        }

        .like-badge {
            background: rgba(0, 0, 0, 0.6);
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 9px;
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            gap: 1px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            cursor: pointer;
            transition: transform 0.2s;
            user-select: none;
            text-align: center;
            line-height: 1.2;
        }

        .like-badge:active {
            transform: scale(0.95);
        }

        .like-badge .sub-text {
            color: #ccc;
            font-size: 7px;
        }

        /* Player Card */
        .player-card {
            background: rgba(10, 15, 25, 0.65);
            border: 1px solid rgba(255, 255, 255, 0.3);
            width: 100%;
            padding: 10px 12px;
            border-radius: 14px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5);
        }

        .song-info {
            text-align: center;
            margin-bottom: 6px;
        }

        .song-info h2 {
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 2px;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .song-info p {
            font-size: 9px;
            color: #ddd;
        }

        /* Timeline / Progress Bar */
        .progress-container {
            margin-bottom: 6px;
            width: 100%;
        }

        #progress {
            width: 100%;
            appearance: none;
            height: 3px;
            background: linear-gradient(to right, #ffffff 0%, #ffffff 0%, rgba(255, 255, 255, 0.3) 0%, rgba(255, 255, 255, 0.3) 100%);
            border-radius: 3px;
            outline: none;
            cursor: pointer;
        }

        #progress::-webkit-slider-thumb {
            appearance: none;
            width: 9px;
            height: 9px;
            background: #ffffff;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 0 4px rgba(0, 0, 0, 0.5);
        }

        .time-codes {
            display: flex;
            justify-content: space-between;
            font-size: 8px;
            color: #eee;
            margin-top: 2px;
            font-weight: 500;
        }

        /* Controls */
        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }

        .controls button {
            background: none;
            border: none;
            color: #fff;
            font-size: 13px;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .controls button:active {
            transform: scale(0.9);
        }

        #play-btn {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, #00f2fe, #4facfe);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #000;
            font-size: 13px;
            box-shadow: 0 2px 8px rgba(0, 242, 254, 0.4);
        }

        /* Volume Bar */
        .volume-container {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 8px;
        }

        #volume {
            width: 100%;
            appearance: none;
            height: 3px;
            background: linear-gradient(to right, #ffffff 100%, #ffffff 100%, rgba(255, 255, 255, 0.3) 100%, rgba(255, 255, 255, 0.3) 100%);
            border-radius: 3px;
            outline: none;
            cursor: pointer;
        }

        #volume::-webkit-slider-thumb {
            appearance: none;
            width: 9px;
            height: 9px;
            background: #fff;
            border-radius: 50%;
            cursor: pointer;
        }

        .vol-icon {
            font-size: 9px;
        }

        /* Playlist Drawer / Box */
        .playlist {
            max-height: 110px;
            overflow-y: auto;
            border-top: 1px solid rgba(255, 255, 255, 0.2);
            padding-top: 6px;
        }

        .playlist::-webkit-scrollbar {
            width: 3px;
        }

        .playlist::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.4);
            border-radius: 3px;
        }

        .playlist-item {
            font-size: 9px;
            padding: 4px 6px;
            margin-bottom: 3px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background 0.2s;
        }

        .playlist-item:hover, .playlist-item.active {
            background: rgba(0, 242, 254, 0.35);
            border-left: 2px solid #00f2fe;
        }

        .playlist-item span {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 210px;
        }

        /* Click Burst Animation */
        .burst-heart {
            position: absolute;
            font-size: 14px;
            animation: burstUp 0.8s ease-out forwards;
            pointer-events: none;
            z-index: 10;
        }

        @keyframes burstUp {
            0% {
                transform: translate(0, 0) scale(0.5);
                opacity: 1;
            }
            100% {
                transform: translate(var(--rand-x), -50px) scale(1.3);
                opacity: 0;
            }
        }
    </style>
</head>

                burst.innerText = emojis[Math.floor(Math.random() * emojis.length)];

                burst.style.top = clickY + 'px';
                
                const randX = (Math.random() - 0.5) * 100;

        let songIndex = 0;

        function buildPlaylist() {
            playlistContainer.innerHTML = '';
            songs.forEach((song, index) => {
                const item = document.createElement('div');
                item.classList.add('playlist-item');
                if (index === songIndex) item.classList.add('active');
                item.innerHTML = `<span>🎵 ${index + 1}. ${song.title}</span>`;
                item.addEventListener('click', () => {
                    songIndex = index;
                    loadSong(songs[songIndex]);
                    playSong();
                    updateActivePlaylistUI();
                });
                playlistContainer.appendChild(item);
            });
        }

        function updateActivePlaylistUI() {
            const items = playlistContainer.querySelectorAll('.playlist-item');
            items.forEach((item, index) => {
                if (index === songIndex) {
                    item.classList.add('active');
                    item.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                } else {
                    item.classList.remove('active');
                }
            });
        }

        function loadSong(song) {
            title.innerText = song.title;
            artist.innerText = song.artist;
            audio.src = song.file;
            progress.value = 0;
            currentTimeEl.innerText = "0:00";
            durationEl.innerText = "0:00";
            updateActivePlaylistUI();
        }

        function playSong() {
            playBtn.innerText = "⏸";
            audio.play().catch(error => {
                console.log("Playback error: ", error);
            });
        }

        function pauseSong() {
            playBtn.innerText = "▶";
            audio.pause();
        }

        playBtn.addEventListener('click', () => {
            const isPlaying = audio.src && !audio.paused;
            if (isPlaying) {
                pauseSong();
            } else {
                if(!audio.src) loadSong(songs[songIndex]);
                playSong();
            }
        });

        nextBtn.addEventListener('click', () => {
            songIndex = (songIndex + 1) % songs.length;
            loadSong(songs[songIndex]);
            playSong();
        });

        prevBtn.addEventListener('click', () => {
            songIndex = (songIndex - 1 + songs.length) % songs.length;
            loadSong(songs[songIndex]);
            playSong();
        });

        // Real-time track duration & progress updater
        audio.addEventListener('timeupdate', (e) => {
            const { duration, currentTime } = e.target;
            if (duration && !isNaN(duration)) {
                const progressPercent = (currentTime / duration) * 100;
                progress.value = progressPercent;
                progress.style.background = `linear-gradient(to right, #ffffff ${progressPercent}%, rgba(255, 255, 255, 0.3) ${progressPercent}%)`;

                let currentMinutes = Math.floor(currentTime / 60);
                let currentSeconds = Math.floor(currentTime % 60);
                if (currentSeconds < 10) currentSeconds = `0${currentSeconds}`;
                currentTimeEl.innerText = `${currentMinutes}:${currentSeconds}`;

                let durationMinutes = Math.floor(duration / 60);
                let durationSeconds = Math.floor(duration % 60);
                if (durationSeconds < 10) durationSeconds = `0${durationSeconds}`;
                durationEl.innerText = `${durationMinutes}:${durationSeconds}`;
            }
        });

        // Jaise hi audio load ho, uska exact duration dikh jaye
        audio.addEventListener('loadedmetadata', () => {
            const duration = audio.duration;
            if (duration && !isNaN(duration)) {
                let durationMinutes = Math.floor(duration / 60);
                let durationSeconds = Math.floor(duration % 60);
                if (durationSeconds < 10) durationSeconds = `0${durationSeconds}`;
                durationEl.innerText = `${durationMinutes}:${durationSeconds}`;
            }
        });

        progress.addEventListener('input', (e) => {
            const duration = audio.duration;
            if (duration) {
                audio.currentTime = (e.target.value / 100) * duration;
            }
        });

        volumeSlider.addEventListener('input', (e) => {
            audio.volume = e.target.value / 100;
            volumeSlider.style.background = `linear-gradient(to right, #ffffff ${e.target.value}%, rgba(255, 255, 255, 0.3) ${e.target.value}%)`;
        });

        audio.addEventListener('ended', () => {
            songIndex = (songIndex + 1) % songs.length;
            loadSong(songs[songIndex]);
            playSong();
        });

        // Initialize Player & Playlist
        buildPlaylist();
        loadSong(songs[songIndex]);
    </script>
</body>
</html>
